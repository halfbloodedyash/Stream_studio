// nginx.conf for RTMP streaming server
worker_processes auto;
rtmp_auto_push on;

events {
    worker_connections 1024;
}

# RTMP configuration
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        
        # Ingest application - receives streams from StreamStudio
        application live {
            live on;
            record off;
            
            # Re-streaming to multiple platforms
            # These are dynamically managed by the media server
            
            # HLS output for web playback
            hls on;
            hls_path /tmp/hls;
            hls_fragment 3;
            hls_playlist_length 60;
            
            # DASH output
            dash on;
            dash_path /tmp/dash;
            dash_fragment 3;
            dash_playlist_length 60;
            
            # Callbacks to notify the API
            on_publish http://api:4000/api/streams/publish;
            on_publish_done http://api:4000/api/streams/publish-done;
            on_play http://api:4000/api/streams/play;
            
            # Allow publishing from any IP (restrict in production)
            allow publish all;
            allow play all;
        }
        
        # Relay application for forwarding to external platforms
        application relay {
            live on;
            record off;
            
            # Push to YouTube
            # push rtmp://a.rtmp.youtube.com/live2/<stream_key>;
            
            # Push to Twitch
            # push rtmp://live.twitch.tv/app/<stream_key>;
            
            # Push to Facebook
            # push rtmps://live-api-s.facebook.com:443/rtmp/<stream_key>;
        }
    }
}

# HTTP configuration for HLS/DASH playback and stats
http {
    sendfile on;
    tcp_nopush on;
    
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    server {
        listen 8080;
        
        # RTMP stats
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }
        
        location /stat.xsl {
            root /etc/nginx/;
        }
        
        # HLS playback
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }
        
        # DASH playback
        location /dash {
            types {
                application/dash+xml mpd;
            }
            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }
        
        # Control API
        location /control {
            rtmp_control all;
        }
    }
}
