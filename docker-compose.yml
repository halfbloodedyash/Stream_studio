# ===========================================
# StreamStudio - Docker Compose
# ===========================================
# Run with: docker compose up -d

version: '3.8'

services:
  # Main API Server
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streamstudio-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_URL=${LIVEKIT_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    volumes:
      - media_uploads:/app/media
    networks:
      - streamstudio
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Signaling Server (WebSocket)
  signaling:
    build:
      context: ./backend/signaling
      dockerfile: Dockerfile
    container_name: streamstudio-signaling
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - PORT=4001
    networks:
      - streamstudio
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  media_uploads:
    driver: local

networks:
  streamstudio:
    driver: bridge
