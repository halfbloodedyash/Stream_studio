version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: streamstudio-db
    environment:
      POSTGRES_USER: streamstudio
      POSTGRES_PASSWORD: streamstudio_dev
      POSTGRES_DB: streamstudio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamstudio"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for caching and pub/sub
  redis:
    image: redis:7-alpine
    container_name: streamstudio-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API Service
  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: streamstudio-api
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://streamstudio:streamstudio_dev@postgres:5432/streamstudio
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      FRONTEND_URL: http://localhost:3000
    ports:
      - "4000:4000"
    volumes:
      - ./backend/api:/app
      - /app/node_modules
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev

  # Signaling Server
  signaling:
    build:
      context: ./backend/signaling
      dockerfile: Dockerfile
    container_name: streamstudio-signaling
    environment:
      NODE_ENV: development
      PORT: 4001
      REDIS_URL: redis://redis:6379
    ports:
      - "4001:4001"
    volumes:
      - ./backend/signaling:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
    command: npm run dev

  # RTMP Media Server (nginx-rtmp)
  rtmp:
    image: tiangolo/nginx-rtmp
    container_name: streamstudio-rtmp
    ports:
      - "1935:1935"  # RTMP
      - "8080:8080"  # HTTP Stats
    volumes:
      - ./infrastructure/nginx-rtmp/nginx.conf:/etc/nginx/nginx.conf:ro
      - hls_data:/tmp/hls
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/stat"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio
    container_name: streamstudio-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Frontend (Next.js)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: streamstudio-frontend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4001
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    command: npm run dev
    depends_on:
      - api
      - signaling

volumes:
  postgres_data:
  redis_data:
  minio_data:
  hls_data:
  uploads:
